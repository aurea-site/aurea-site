<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arquivo 01 · Lavínia</title><style>:root{--p:#b44cff;--p2:#6b1e88;--gold:#d7b56d;--ink:#08050b;--paper:#17101b}*{box-sizing:border-box}body{margin:0;background:#050307;color:#f7eff8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}.scene{height:100svh;position:relative;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% -10%,#55205f 0,#190b20 34%,#070409 72%)}.scene:before{content:"";position:absolute;inset:0;opacity:.16;background-image:repeating-linear-gradient(90deg,transparent 0 31px,#a34cc522 32px),repeating-linear-gradient(0deg,transparent 0 31px,#a34cc522 32px)}.case{z-index:2;width:min(94vw,430px);height:min(90svh,760px);position:relative;border:1px solid #a84ac777;border-radius:26px;background:linear-gradient(160deg,#1b1020,#0d0910 60%);box-shadow:0 24px 80px #000,0 0 45px #8d36aa33;overflow:hidden}.top{height:8px;background:linear-gradient(90deg,var(--p2),var(--gold),var(--p))}.page{height:calc(100% - 8px);padding:25px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center;animation:in .45s}.ey{font-size:10px;letter-spacing:.25em;color:#caa6d5;text-transform:uppercase}.icon{font-size:55px;filter:drop-shadow(0 0 15px #a84bc777);margin:13px}.title{font-family:Georgia,serif;font-size:31px;line-height:1.05;margin:8px 0;color:#f2d8ff}.txt{font-family:Georgia,serif;font-size:17px;line-height:1.55;color:#e9dfea}.accent{color:#e9a7ff}.btn{margin-top:22px;padding:16px;border:1px solid #b75ada;border-radius:14px;background:linear-gradient(180deg,#3a1747,#24102c);color:white;font-weight:800;letter-spacing:.08em;box-shadow:0 8px 28px #0008;transition:.15s}.btn:active{transform:scale(.97)}.seal{width:112px;height:112px;border-radius:50%;margin:24px auto;background:radial-gradient(circle at 35% 30%,#d46bf3,#702286 55%,#35113e);display:grid;place-items:center;font:700 35px Georgia;box-shadow:0 0 0 7px #3a163f,0 0 45px #b349d877;animation:pulse 1.8s infinite}.file{border:1px dashed #a85cc077;background:#ffffff08;padding:17px;text-align:left;transform:rotate(-1deg);margin:18px 0}.redact{background:#d8c5dc;color:#d8c5dc;padding:0 4px}.clues{display:grid;gap:10px;margin:17px 0}.clue{padding:12px;border:1px solid #593461;border-radius:12px;background:#130c16;text-align:left;opacity:.35;transform:translateX(-8px);transition:.4s}.clue.on{opacity:1;transform:none;border-color:#b54fd1}.meter{height:7px;background:#26152b;border-radius:9px;overflow:hidden;margin:17px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,#74318b,#e47aff);transition:width .5s}.stamp{display:inline-block;border:3px solid #b852cf;color:#e990ff;padding:8px 12px;font-weight:900;transform:rotate(-5deg);margin:10px}.evidence{border:1px solid #7e5b32;background:#d7b56d0c;padding:20px;position:relative}.evidence:before{content:"EVIDÊNCIA";position:absolute;top:-10px;left:15px;background:#17101b;color:#d7b56d;padding:2px 8px;font-size:10px;letter-spacing:.2em}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:18px 0}.slot{aspect-ratio:1;border:1px solid #3e2945;border-radius:8px;display:grid;place-items:center}.slot.on{border-color:#d064ef;box-shadow:0 0 16px #b14bdc88;color:#efb3ff}@keyframes in{from{opacity:0;transform:translateY(12px)}}@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 0 7px #3a163f,0 0 65px #c756efaa}}.tap{font-size:11px;color:#987d9f;margin-top:12px}</style></head><body><main class="scene"><section class="case"><div class="top"></div><div id="app" class="page"></div></section></main><script>let s=0,c=0;const A=document.getElementById('app');function go(){s++;c=0;draw()}function draw(){if(s===0)A.innerHTML='<div class="ey">CARTA I / XVIII · CONFIDENCIAL</div><div class="seal" onclick="go()">I</div><h1 class="title">Lavínia,<br>alguma coisa despertou hoje…</h1><p class="txt">Faltam <b>18 dias.</b><br>Durante os próximos 18, você estará sob investigação.</p><p class="txt accent">Existem 18 características que fazem você ser exatamente… você.</p><button class="btn" onclick="go()">ROMPER O SELO</button><div class="tap">toque para iniciar a investigação</div>';else if(s===1)A.innerHTML='<div class="ey">CARTA I · ARQUIVO Nº 01</div><div class="icon">🗂️</div><div class="file"><b>CASO Nº 01</b><br><small>CLASSIFICAÇÃO</small><br><span class="accent">ESTRANHAMENTE SUSPEITA</span><p>Uma nova investigação foi aberta.<br>A principal suspeita ainda não sabe do que está sendo acusada.</p><span class="redact">LAVÍNIA LAVÍNIA</span></div><button class="btn" onclick="go()">INICIAR INVESTIGAÇÃO</button>';else if(s===2){let q=['Você entra em uma livraria. Entre romance, fantasia e histórias felizes… seus olhos procuram <b>aquele corredor.</b>','Quanto mais perturbadora a história, maior a chance de você dizer: <b>“Nossa… parece interessante.” 💜</b>','<b>Assassinato. Mistério. Investigação. Psicopatas.</b><br>Para algumas pessoas: 🚩<br>Para você: 📚 + 💜'];A.innerHTML='<div class="ey">COLETA DE EVIDÊNCIAS</div><h1 class="title">Interrogatório</h1><div class="meter"><i style="width:'+((c+1)*33)+'%"></i></div><div class="clues">'+q.map((x,i)=>'<div class="clue '+(i<=c?'on':'')+'"><b>PISTA 0'+(i+1)+'</b><br>'+x+'</div>').join('')+'</div><button class="btn" onclick="'+(c<2?'c++;draw()':'go()')+'">'+(c<2?'REVELAR PRÓXIMA PISTA':'FECHAR O CASO')+'</button>'}else if(s===3)A.innerHTML='<div class="ey">RESULTADO DA INVESTIGAÇÃO</div><div class="stamp">CARACTERÍSTICA #01</div><h1 class="title">Amante de livros estranhos e histórias de assassinatos.</h1><p class="txt">Você tem essa curiosidade peculiar pelo lado mais sombrio das histórias.</p><p class="txt accent">Onde alguém vê algo macabro, você já quer saber quem fez, por quê, como descobriram e se existe um livro sobre isso.</p><button class="btn" onclick="go()">ABRIR DOSSIÊ CONFIDENCIAL</button>';else if(s===4)A.innerHTML='<div class="ey">MOTIVO #01 PARA SE APAIXONAR POR VOCÊ</div><div class="icon">♥️</div><h1 class="title">Sua curiosidade.</h1><p class="txt">Você não se contenta com a superfície. Quando alguma coisa desperta seu interesse, você quer descobrir a história inteira.</p><p class="txt accent"><b>Talvez amar você tenha um pouco disso também:</b><br>quanto mais eu te conheço, mais eu quero descobrir.</p><button class="btn" onclick="go()">ACESSAR EVIDÊNCIA Nº 01</button>';else if(s===5)A.innerHTML='<div class="ey">OBJETO RELACIONADO AO CASO</div><h1 class="title">Evidência nº 01</h1><div class="evidence"><div class="icon">📦</div><b class="accent">STATUS: EM TRÂNSITO</b><p class="txt">Os registros indicam crimes de outros tempos, histórias que parecem ter saído de arquivos esquecidos e uma quantidade suspeita de curiosidade mórbida.</p><p>Quando chegar, será entregue diretamente à principal suspeita.</p></div><button class="btn" onclick="go()">ENCERRAR ARQUIVO</button>';else A.innerHTML='<div class="ey">01 / 18 · ARQUIVO CONCLUÍDO</div><h1 class="title">Carta encerrada.</h1><div class="grid">'+Array.from({length:18},(_,i)=>'<div class="slot '+(!i?'on':'')+'">'+(!i?'◆':'◇')+'</div>').join('')+'</div><p class="txt">17 cartas permanecem seladas.</p><p class="txt accent">Até lá… não cometa nenhum crime.<br>Ou pelo menos não sem terminar o livro primeiro. 🖤</p><h2 class="title" style="font-size:24px">Até amanhã, Lavínia. 💜</h2><p>Com amor,<br><b>sua cúmplice. ❤️</b></p><button class="btn" onclick="s=0;draw()">REABRIR CARTA</button>'}draw()</script></body></html>
