<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dossiê 01 — Lavínia</title><style>:root{--ink:#0a090a;--paper:#d8d0c0;--paper2:#bfb5a3;--red:#6d1720;--gold:#9a8153}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:#d9d4ca;font-family:"Courier New",monospace}body{background:radial-gradient(circle at 50% 0,#242021,#090909 58%);overflow-x:hidden}.desk{min-height:100svh;padding:22px 15px 40px;display:grid;place-items:center}.folder{width:min(94vw,460px);min-height:82svh;background:#171515;border:1px solid #393333;box-shadow:0 30px 80px #000;border-radius:3px;position:relative;padding:34px 26px 26px}.folder:before{content:"ARQUIVO 01";position:absolute;top:-18px;left:20px;background:#262121;border:1px solid #443d3d;border-bottom:0;padding:8px 22px;color:#9c9285;font-size:10px;letter-spacing:.2em}.page{animation:appear .55s ease}.meta{display:flex;justify-content:space-between;color:#776f68;font-size:9px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid #302c2c;padding-bottom:12px}.num{font-family:Georgia,serif;font-size:78px;line-height:.9;color:#332d2e;margin:28px 0 6px}.kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#9a8153}.title{font:normal 31px/1.12 Georgia,serif;color:#e4ded3;margin:10px 0 18px}.body{font:16px/1.65 Georgia,serif;color:#bbb4aa}.body em{color:#e1d7c7}.action{width:100%;margin-top:25px;background:transparent;color:#b7aa98;border:1px solid #514942;padding:15px 12px;font:10px "Courier New";letter-spacing:.2em;text-transform:uppercase}.action:active{background:#201c1c}.sealwrap{margin:38px auto 24px;width:124px;height:124px;display:grid;place-items:center;position:relative}.seal{width:88px;height:88px;border-radius:50%;background:#61151d;color:#b98586;border:1px solid #8d3037;display:grid;place-items:center;font:italic 31px Georgia;box-shadow:inset 0 0 0 7px #4c1117,0 7px 20px #000;cursor:pointer}.sealwrap:after{content:"";position:absolute;width:1px;height:70px;background:#4c4440;top:118px}.case{margin:24px 0;border:1px solid #393332;padding:18px;background:#111010;position:relative}.case b{display:block;font-size:10px;letter-spacing:.18em;color:#8e7b59;margin-bottom:12px}.type{font-size:13px;line-height:1.6;color:#a9a19a}.black{background:#0b0b0b;color:#0b0b0b;padding:0 7px}.evidence{border-left:2px solid #6d1720;padding:12px 0 12px 18px;margin:18px 0;opacity:.2;transform:translateY(8px);transition:.45s}.evidence.on{opacity:1;transform:none}.evidence small{color:#766b61;letter-spacing:.15em}.evidence p{font:16px/1.55 Georgia,serif;margin:7px 0}.progress{height:2px;background:#272323;margin:22px 0}.progress i{display:block;height:100%;background:#785d36;transition:.4s}.stamp{display:inline-block;margin:16px 0 8px;border:2px solid #651b23;color:#8c3a40;padding:8px 11px;transform:rotate(-2deg);font-size:11px;letter-spacing:.15em}.quote{font:italic 22px/1.45 Georgia,serif;color:#ded4c4;border-top:1px solid #332e2c;border-bottom:1px solid #332e2c;padding:20px 0;margin:22px 0}.gift{background:#cfc6b5;color:#292522;padding:24px 20px;margin:25px -5px 15px;box-shadow:0 9px 25px #0008;transform:rotate(.5deg);position:relative}.gift:before{content:"EVIDÊNCIA Nº 01";position:absolute;top:8px;right:12px;color:#77202a;border:2px solid #77202a;padding:4px 7px;font-size:9px;transform:rotate(3deg)}.gift h2{font:25px Georgia;margin:25px 0 10px}.gift p{font:15px/1.55 Georgia}.slots{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:28px 0}.slot{height:22px;border-bottom:1px solid #393333;text-align:center;font-size:9px;color:#504949}.slot.on{color:#9a8153;border-color:#9a8153}.end{font:italic 20px/1.55 Georgia;color:#d5cbbc}@keyframes appear{from{opacity:0;filter:blur(2px);transform:translateY(8px)}}@media(min-width:700px){.folder{padding:44px 38px}}.portrait{position:relative;margin:18px 0 22px;height:255px;overflow:hidden;border:1px solid #3a3332;background:#0d0b0c}.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:saturate(.72) contrast(1.08) brightness(.72)}.portrait:after{content:"SUJEITO 01 · LAVÍNIA";position:absolute;left:12px;bottom:10px;background:#0a0909dd;color:#b9aa94;padding:6px 9px;font-size:9px;letter-spacing:.18em}.cards{display:grid;gap:11px;margin:20px 0}.card{border:1px solid #3a3432;padding:16px;text-align:left;cursor:pointer;transition:.25s;background:#100e0f}.card.locked{filter:blur(3px);opacity:.35}.card.open{border-color:#725e3e;background:#151210}.card small{letter-spacing:.16em;color:#8c7a5d}.redaction{display:inline;background:#050505;color:#050505;cursor:pointer;transition:.35s;padding:1px 5px}.redaction.revealed{background:transparent;color:#d8ccba}.book{width:min(190px,55vw);display:block;margin:22px auto 16px;box-shadow:0 18px 45px #000;transform:rotate(-1.5deg);transition:.35s}.book:hover,.book:active{transform:rotate(0) scale(1.03)}.reveal{animation:appear .7s}.age{font-size:10px;letter-spacing:.18em;color:#7d726a;margin-top:8px}</style></head><body><main class="desk"><section class="folder"><div id="app"></div></section></main><script>let s=0,e=0;const L='',B='https://darkside.vteximg.com.br/arquivos/ids/193782-1000-1000/crimes_a_moda_loja_3a.png';const a=document.getElementById('app');const top='<div class="meta"><span>confidencial · 01/18</span><span>acesso restrito</span></div>';function next(){s++;e=0;render()}function render(){if(s===0)a.innerHTML='<div class="page">'+top+'<div class="portrait" style="display:grid;place-items:center"><div style="font:italic 22px Georgia;color:#b9aa94">LAVÍNIA</div></div><div class="kicker">Dossiê particular</div><h1 class="title">Lavínia,<br>há um arquivo sobre você.</h1><div class="age">23 ANOS · 18 DIAS · 18 CARTAS</div><p class="body">Ele será aberto aos poucos. Uma página por dia. Dezoito registros antes da data final.</p><div class="sealwrap"><div class="seal" onclick="next()">L</div></div><p class="type" style="text-align:center;margin-top:72px">ROMPA O LACRE PARA ACESSAR O PRIMEIRO REGISTRO</p></div>';else if(s===1)a.innerHTML='<div class="page">'+top+'<div class="case"><b>RELATÓRIO DE ABERTURA</b><div class="type">CASO Nº 01<br>SUJEITO: LAVÍNIA<br>STATUS: <span style="color:#9b6568">SOB OBSERVAÇÃO</span><br><br>Uma investigação foi aberta.<br>A acusação ainda permanece <span class="black">CONFIDENCIAL</span>.</div></div><p class="body">Antes de revelar o motivo, três evidências precisam ser examinadas.</p><button class="action" onclick="next()">examinar evidências</button></div>';else if(s===2){let q=['Em uma livraria, entre romance, fantasia e finais felizes… existe um corredor que chama sua atenção primeiro.','Quanto mais perturbadora a história, maior a chance de ela ganhar a sua curiosidade.','Assassinato. Mistério. Investigação. Psicopatas. Para muita gente, um alerta. Para você, uma boa leitura.'];a.innerHTML='<div class="page">'+top+'<div class="kicker" style="margin-top:28px">levantamento de evidências</div><p class="type">Abra os registros em ordem.</p><div class="cards">'+q.map((x,i)=>'<div class="card '+(i<e?'open':i>e?'locked':'')+'" onclick="if('+i+'===e){e++;render()}"><small>REGISTRO 0'+(i+1)+'</small><p class="body">'+(i<e?x:'[ conteúdo lacrado ]')+'</p></div>').join('')+'</div>'+(e>=3?'<button class="action" onclick="next()">emitir conclusão</button>':'')+'</div>'}else if(s===3)a.innerHTML='<div class="page">'+top+'<div class="stamp">CARACTERÍSTICA Nº 01 · CONFIRMADA</div><h1 class="title">Amante de livros estranhos e histórias de assassinatos.</h1><p class="body">Você tem uma curiosidade peculiar pelo lado mais sombrio das histórias.</p><p class="body">Onde alguém vê algo macabro, você quer saber <em>quem fez, por quê, como descobriram — e se existe um livro sobre isso.</em></p><button class="action" onclick="next()">abrir anotação pessoal</button></div>';else if(s===4)a.innerHTML='<div class="page">'+top+'<div class="kicker" style="margin-top:30px">motivo nº 01</div><h1 class="title">Sua curiosidade.</h1><div class="quote">“Você não se contenta com a <span class="redaction" onclick="this.classList.add(\'revealed\')">superfície</span>.”</div><p class="type">toque na tarja</p><p class="body">Quando alguma coisa desperta seu interesse, você quer descobrir a história inteira.</p><p class="body"><em>Talvez amar você tenha um pouco disso também: quanto mais eu te conheço, mais eu quero descobrir.</em></p><button class="action" onclick="next()">consultar evidência física</button></div>';else if(s===5)a.innerHTML='<div class="page reveal">'+top+'<div class="kicker" style="margin-top:24px">evidência nº 01 · revelada</div><img class="book" src="'+B+'" alt="Crimes à Moda Antiga"><h1 class="title" style="font-size:27px">Crimes à Moda Antiga</h1><p class="body"><em>Valêncio Xavier</em></p><div class="gift" style="margin-top:14px"><p>O primeiro presente foi escolhido para a garota que consegue olhar para um crime antigo e pensar: <b>preciso saber a história inteira.</b></p><p><b>Status:</b> a caminho da principal suspeita.</p></div><button class="action" onclick="next()">arquivar caso nº 01</button></div>';else a.innerHTML='<div class="page">'+top+'<div class="num">01</div><div class="kicker">arquivo concluído</div><h1 class="title">Dezessete permanecem lacrados.</h1><div class="slots">'+Array.from({length:18},(_,i)=>'<div class="slot '+(!i?'on':'')+'">'+String(i+1).padStart(2,'0')+'</div>').join('')+'</div><p class="end">Até lá… não cometa nenhum crime.<br>Ou pelo menos não sem terminar o livro primeiro.</p><p class="body" style="margin-top:30px">Até amanhã, Lavínia.<br><br>Com amor,<br><em>sua cúmplice.</em></p><button class="action" onclick="s=0;render()">reabrir arquivo</button></div>'}render()</script></body></html>
