<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carta I · Lavínia</title><style>*{box-sizing:border-box}body{margin:0;background:#08040b;color:#f5eaf8;font-family:Georgia,serif}.a{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 5%,#481257,#100715 50%,#050207)}.c{width:min(94vw,430px);min-height:90vh;padding:32px 24px;border:1px solid #8136a0;border-radius:28px;background:#110817;text-align:center;box-shadow:0 0 55px #9b36c633;display:flex;flex-direction:column;justify-content:center}.s{font:11px Arial;letter-spacing:.22em;color:#c88de0}.x{font-size:62px}h1,h2{color:#e6a0ff}p{line-height:1.6}.b{margin-top:22px;padding:16px;border:1px solid #963db8;border-radius:999px;background:#25102e;color:#fff;font-weight:bold;width:100%}.f{animation:f .45s}@keyframes f{from{opacity:0;transform:translateY(8px)}}.g{color:#efaaff}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:20px 0}.q{padding:8px 0;border:1px solid #3e2945;border-radius:8px}.on{border-color:#b84bd8;color:#f1aaff;box-shadow:0 0 15px #b84bd866}</style></head><body><main class="a"><section class="c"><div id="v"></div></section></main><script>let i=0;const p=[['👑🔎','CARTA I / XVIII · CONFIDENCIAL','Lavínia, alguma coisa despertou hoje…','Faltam <b>18 dias.</b><br>Durante os próximos 18, você estará sob investigação.','ROMPER O SELO'],['📁','CASO Nº 01','Estranhamente suspeita','Uma investigação foi aberta. A principal suspeita ainda não sabe do que está sendo acusada.','ABRIR ARQUIVO'],['🔎','PISTA 01','Onde tudo começa…','Você entra em uma livraria. Romance. Fantasia. Histórias felizes…<br><br><span class="g">E seus olhos procuram justamente aquele corredor.</span>','PRÓXIMA PISTA'],['🕵️','PISTA 02','Comportamento suspeito','Quanto mais perturbadora a história, maior a chance de você pensar:<br><br><span class="g">“Nossa… parece interessante.” 😂</span>','PRÓXIMA PISTA'],['📚','PISTA 03','As evidências se acumulam','Assassinato. Mistério. Investigação. Psicopatas.<br><br>Para algumas pessoas: 🚩<br>Para você: 📚❤️','REVELAR RESULTADO'],['📚🖤','CARACTERÍSTICA 01/18 DESBLOQUEADA','Amante de livros estranhos e histórias de assassinatos.','Você tem essa curiosidade peculiar pelo lado mais sombrio das histórias. Quer saber quem fez, por quê, como descobriram e se existe um livro sobre isso.','CONTINUAR'],['❤️','MOTIVO 01/18 PARA SE APAIXONAR POR VOCÊ','Sua curiosidade.','Você não se contenta com a superfície. Quando alguma coisa desperta seu interesse, você quer descobrir a história inteira.<br><br><span class="g">Talvez amar você tenha um pouco disso também: <b>quanto mais eu te conheço, mais eu quero descobrir.</b></span>','DESCOBRIR O PRESENTE'],['📦🔎','EVIDÊNCIA Nº 01 · EM TRÂNSITO','Objeto relacionado ao caso localizado.','Os registros indicam <b>crimes de outros tempos</b>, histórias saídas de arquivos esquecidos e uma quantidade suspeita de curiosidade mórbida.<br><br>Quando chegar, será entregue diretamente à principal suspeita.','ENCERRAR CASO']];function r(){if(i<p.length){let z=p[i];v.innerHTML='<div class="f"><div class="x">'+z[0]+'</div><div class="s">'+z[1]+'</div><h1>'+z[2]+'</h1><p>'+z[3]+'</p><button class="b" onclick="n()">'+z[4]+'</button></div>'}else{v.innerHTML='<div class="f"><div class="s">01 / 18</div><h1>Carta encerrada.</h1><div class="grid">'+Array.from({length:18},(_,j)=>'<div class="q '+(j==0?'on':'')+'">'+(j==0?'◆':'◇')+'</div>').join('')+'</div><p>17 cartas permanecem seladas.</p><p class="g">Até lá… não cometa nenhum crime.<br>Ou pelo menos não sem terminar o livro primeiro. 🖤</p><h2>Até amanhã, Lavínia. 💜</h2><p>Com amor,<br><b>sua cúmplice. ❤️</b></p></div>'}}function n(){i++;r()}r()</script></body></html>
